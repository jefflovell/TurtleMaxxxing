[project]
name = "turtlemaxxxing"
version = "0.2.0"
description = "Local-first personal assistant and project manager. Privacy first."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
turtlemaxxxing = "turtlemaxxxing.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turtlemaxxxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
