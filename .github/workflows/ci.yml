# Runs every test in public on every push and pull request.
# See docs/TESTING.md for what each test promises.
#
# Supply-chain hygiene: third-party actions are pinned to exact commit SHAs
# (the version tag is in the comment), the workflow can only read the repo,
# and no secrets are used.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first target platform; Linux keeps the code portable.
        os: [windows-latest, ubuntu-latest]
        # Oldest supported and newest.
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked --directory backend

      - name: Privacy and security promises
        run: uv run --directory backend pytest -v tests/test_privacy.py tests/test_local_security.py

      - name: Full test suite
        run: uv run --directory backend pytest -v

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Type-check and build
        run: npm run build --prefix frontend

  installer:
    # The free install path (M2.5), run exactly as a user would, but unattended:
    # Windows PowerShell 5.1, the real release ZIP, a clean folder.
    name: Installer and updater (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the app's data inside the runner's temp folder. (The runner context
      # can't be used in a job-level env:, so it's set here for the later steps.)
      - name: Use a temporary data folder
        run: Add-Content -Path $env:GITHUB_ENV -Value "TURTLE_DATA_DIR=$env:RUNNER_TEMP\turtle-data" -Encoding ascii

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the release ZIP (committed files only)
        run: scripts\build-bundle.ps1 -OutDir "$env:RUNNER_TEMP\bundle"

      - name: Install from the ZIP
        run: |
          Expand-Archive (Get-Item "$env:RUNNER_TEMP\bundle\TurtleMaxxxing-*.zip").FullName "$env:RUNNER_TEMP\unzipped"
          & "$env:RUNNER_TEMP\unzipped\TurtleMaxxxing\scripts\setup.ps1" -Yes -NoStart `
            -InstallDir "$env:RUNNER_TEMP\install" -StartMenu "$env:RUNNER_TEMP\startmenu"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($lnk in 'I like turtles.lnk', 'TurtleMaxxxing\Update TurtleMaxxxing.lnk', 'TurtleMaxxxing\Check my TurtleMaxxxing install.lnk') {
            if (-not (Test-Path "$env:RUNNER_TEMP\startmenu\$lnk")) { throw "missing shortcut $lnk" }
          }

      - name: Start it and check it answers
        run: |
          & "$env:RUNNER_TEMP\install\scripts\start-turtle.ps1" -NoOpen
          & "$env:RUNNER_TEMP\install\scripts\check-install.ps1" -NoClipboard

      - name: Update over the running app
        run: |
          $zip = (Get-Item "$env:RUNNER_TEMP\bundle\TurtleMaxxxing-*.zip").FullName
          & "$env:RUNNER_TEMP\install\scripts\update.ps1" -FromZip $zip -Force -Yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\install.previous")) { throw 'previous version was not kept' }

      - name: A broken release is rolled back
        run: |
          $broken = "$env:RUNNER_TEMP\broken"
          Copy-Item -Recurse "$env:RUNNER_TEMP\unzipped\TurtleMaxxxing" $broken
          Set-Content "$broken\VERSION" '9.9.9' -NoNewline
          Set-Content "$broken\backend\tests\test_zz_broken.py" "def test_this_release_is_broken():`n    assert False`n"
          $before = Get-Content "$env:RUNNER_TEMP\install\VERSION"
          & "$env:RUNNER_TEMP\install\scripts\update.ps1" -FromFolder $broken -Yes
          if ($LASTEXITCODE -eq 0) { throw 'a broken release was accepted' }
          if ((Get-Content "$env:RUNNER_TEMP\install\VERSION") -ne $before) { throw 'the previous version was not restored' }
          & "$env:RUNNER_TEMP\install\scripts\start-turtle.ps1" -NoOpen
          Write-Output 'Rolled back and running.'
